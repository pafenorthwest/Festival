name: Integration Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-integration
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: festival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d festival_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Frontend typecheck
        run: bun run --cwd packages/frontend check:types

      - name: Backend & test typecheck
        run: bunx --bun tsc -p packages/backend/tsconfig.json --noEmit

      - name: SQL parameter check
        run: bun run check:sql

      - name: Schema parity check
        id: schema_parity
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS festival_parity;" \
            -c "CREATE DATABASE festival_parity;"
          docker run --rm --network host -e PGPASSWORD=postgres -v "${PWD}:/workspace:ro" -w /workspace postgres:17-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -d festival_parity -v ON_ERROR_STOP=1 -f database/postgres17-schema.sql
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/festival_parity" bun run migrate
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine \
            pg_dump -h 127.0.0.1 -p 5432 -U postgres -d festival_parity \
            --schema-only --schema=orgs --no-owner --no-privileges > /tmp/migrated-schema.sql
          bun run check:schema-parity /tmp/migrated-schema.sql

      - name: Clean up schema parity database
        if: always() && (steps.schema_parity.outcome == 'success' || steps.schema_parity.outcome == 'failure')
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS festival_parity;"
          rm -f /tmp/migrated-schema.sql

      - name: Configure test database log level
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE festival_test SET log_min_messages = 'fatal';"

      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/festival_test
          POSTGRES_INTEGRATION_URL: postgres://postgres:postgres@127.0.0.1:5432/festival_test
        run: bun run test

  deploy-integration:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: integration
      url: https://int.artsfestival.online/

    steps:
      - name: Deploy to Integration Host via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DO_INTEGRATION_HOST }}
          username: ${{ secrets.DO_INTEGRATION_USER || 'webadmin' }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            cd /opt/Festival
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            git diff --quiet
            git diff --cached --quiet
            bash cloud-setup/03-prepare-images.sh
            docker compose --env-file cloud-setup/.env -f cloud-setup/compose.yml up -d postgres --wait
            docker run --rm --network festival-cloud_default --env-file cloud-setup/.env \
              -e DB_HOST=postgres -e DB_PORT=5432 -e DATABASE=festival_octv3_db \
              -e DB_USER=festivaladmin -e DB_SSL=false -e DB_SCHEMA=orgs \
              -v "${PWD}:/app:ro" -w /app oven/bun:1.4.2-alpine bun run scripts/migrate.ts
            docker compose --env-file cloud-setup/.env -f cloud-setup/compose.yml up -d --no-build --pull never

  smoke-test:
    needs: deploy-integration
    runs-on: ubuntu-latest

    steps:
      - name: Smoke test integration frontend and backend
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              https://int.artsfestival.online/healthz > /dev/null \
              && curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                https://int.artsfestival.online/api/organizations/pafe/landing \
                --output "$RUNNER_TEMP/integration-landing.json" \
              && jq --exit-status \
                '.organization.slug == "pafe" and (.organization.name | type == "string") and (.festivals | type == "array")' \
                "$RUNNER_TEMP/integration-landing.json" > /dev/null; then
              echo "Frontend and database-backed API checks passed on attempt $i"
              exit 0
            fi
            if [ "$i" -lt 12 ]; then
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done
          echo "Integration smoke checks failed after 12 attempts"
          exit 1
