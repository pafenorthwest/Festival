name: Phase 1 E2E Smoke

on:
  pull_request:
    branches:
      - main
      - release
      - 'release/v*'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional external base URL for read-safe smoke tests (e.g. https://int.artsfestival.online)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  e2e-phase1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: festival_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d festival_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build common package
        run: bun run build:common

      - name: Apply PostgreSQL schema and migrations
        if: ${{ inputs.base_url == '' }}
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/festival_e2e
          DB_SCHEMA: orgs
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=postgres -v "${PWD}:/workspace:ro" -w /workspace postgres:17-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -d festival_e2e -v ON_ERROR_STOP=1 -f database/postgres17-schema.sql
          bun run migrate

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Phase 1 Playwright E2E (local Postgres)
        if: ${{ inputs.base_url == '' }}
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/festival_e2e
          DB_SCHEMA: orgs
        run: bun run test:e2e:phase1

      - name: Run Phase 1 Playwright E2E (external target)
        if: ${{ inputs.base_url != '' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        run: bun run test:e2e:phase1

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-phase1-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
