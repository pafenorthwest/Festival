name: Continuous Deployment

on:
  push:
    branches:
      - release
      - 'release/v*'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'integration'
        type: choice
        options:
          - integration
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (startsWith(github.ref, 'refs/tags/v') && 'production') || (startsWith(github.ref, 'refs/heads/release/v') && 'staging') || (github.ref == 'refs/heads/release' && 'integration') || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: festival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d festival_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Frontend typecheck
        run: bun run --cwd packages/frontend check:types

      - name: Backend & test typecheck
        run: bunx --bun tsc -p packages/backend/tsconfig.json --noEmit

      - name: SQL parameter check
        run: bun run check:sql

      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/festival_test
          POSTGRES_INTEGRATION_URL: postgres://postgres:postgres@127.0.0.1:5432/festival_test
        run: bun run test

  build-and-push:
    name: Build & Push Images
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta_backend.outputs.version }}
      target_environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (startsWith(github.ref, 'refs/tags/v') && 'production') || (startsWith(github.ref, 'refs/heads/release/v') && 'staging') || (github.ref == 'refs/heads/release' && 'integration') || '' }}

    steps:
      - name: Validate resolved target environment
        env:
          TARGET_ENVIRONMENT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (startsWith(github.ref, 'refs/tags/v') && 'production') || (startsWith(github.ref, 'refs/heads/release/v') && 'staging') || (github.ref == 'refs/heads/release' && 'integration') || '' }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            integration|staging|production)
              echo "Resolved target environment: $TARGET_ENVIRONMENT"
              ;;
            *)
              echo "Error: Unable to resolve valid target_environment for event '${{ github.event_name }}' and ref '${{ github.ref }}'." >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Backend image metadata
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/festival-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Extract Frontend image metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/festival-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Target Host
    needs: [verify, build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build-and-push.outputs.target_environment }}
      url: ${{ vars.DEPLOY_PUBLIC_URL }}

    steps:
      - name: Check deployment host configuration
        id: host_check
        env:
          TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
        run: |
          if [ -n "$TARGET_HOST" ] && [ -n "$SSH_KEY" ] && [ -n "$PUBLIC_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping remote SSH rollout: DEPLOY_HOST, DEPLOY_SSH_PRIVATE_KEY, or DEPLOY_PUBLIC_URL is not configured for this environment."
          fi

      - name: Deploy to Target Host via SSH
        if: steps.host_check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'webadmin' }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            cd /opt/Festival
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            git diff --quiet
            git diff --cached --quiet
            bash cloud-setup/03-prepare-images.sh
            docker compose --env-file cloud-setup/.env -f cloud-setup/compose.yml up -d --no-build --pull never

  smoke-test:
    name: Post-Deploy Health & Smoke Verification
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build-and-push.outputs.target_environment }}
    env:
      BASE_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
      TARGET_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Verify /healthz and database-backed landing endpoint
        run: |
          if [ -z "$TARGET_HOST" ] && [ -z "$BASE_URL" ]; then
            echo "Skipping remote live smoke test because no deployment target host or DEPLOY_PUBLIC_URL is configured."
            exit 0
          fi
          if [ -z "$BASE_URL" ]; then
            echo "Error: DEPLOY_PUBLIC_URL is required for smoke verification when DEPLOY_HOST is configured." >&2
            exit 1
          fi
          normalized_base="${BASE_URL%/}"
          for i in {1..12}; do
            health_payload="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "${normalized_base}/healthz" || true)"
            if [ "$health_payload" = '{"status":"ok"}' ] \
              && curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                "${normalized_base}/api/organizations/pafe/landing" \
                --output "$RUNNER_TEMP/deploy-landing.json" \
              && jq --exit-status \
                '.organization.slug == "pafe" and (.organization.name | type == "string") and (.festivals | type == "array")' \
                "$RUNNER_TEMP/deploy-landing.json" > /dev/null; then
              echo "Health check (/healthz) and database-backed API smoke check passed on attempt $i"
              exit 0
            fi
            if [ "$i" -lt 12 ]; then
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done
          echo "Post-deploy smoke verification failed after 12 attempts"
          exit 1
