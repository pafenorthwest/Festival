name: Continuous Deployment

on:
  push:
    branches:
      - release
      - 'release/v*'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'integration'
        type: choice
        options:
          - integration
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (startsWith(github.ref, 'refs/tags/v') && 'production') || (startsWith(github.ref, 'refs/heads/release/v') && 'staging') || (github.ref == 'refs/heads/release' && 'integration') || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: festival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d festival_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Frontend typecheck
        run: bun run --cwd packages/frontend check:types

      - name: Backend & test typecheck
        run: bunx --bun tsc -p packages/backend/tsconfig.json --noEmit

      - name: SQL parameter check
        run: bun run check:sql

      - name: Schema parity check
        id: schema_parity
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS festival_parity;" \
            -c "CREATE DATABASE festival_parity;"
          docker run --rm --network host -e PGPASSWORD=postgres -v "${PWD}:/workspace:ro" -w /workspace postgres:17-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -d festival_parity -v ON_ERROR_STOP=1 -f database/postgres17-schema.sql
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/festival_parity" bun run migrate
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine \
            pg_dump -h 127.0.0.1 -p 5432 -U postgres -d festival_parity \
            --schema-only --schema=orgs --no-owner --no-privileges > /tmp/migrated-schema.sql
          bun run check:schema-parity /tmp/migrated-schema.sql

      - name: Clean up schema parity database
        if: always() && (steps.schema_parity.outcome == 'success' || steps.schema_parity.outcome == 'failure')
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS festival_parity;"
          rm -f /tmp/migrated-schema.sql

      - name: Configure test database log level
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE festival_test SET log_min_messages = 'fatal';"

      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/festival_test
          POSTGRES_INTEGRATION_URL: postgres://postgres:postgres@127.0.0.1:5432/festival_test
        run: bun run test

  build-and-push:
    name: Build & Push Images
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (startsWith(github.ref, 'refs/tags/v') && 'production') || (startsWith(github.ref, 'refs/heads/release/v') && 'staging') || (github.ref == 'refs/heads/release' && 'integration') || 'integration' }}
    outputs:
      image_tag: ${{ steps.meta_backend.outputs.version }}
      target_environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (startsWith(github.ref, 'refs/tags/v') && 'production') || (startsWith(github.ref, 'refs/heads/release/v') && 'staging') || (github.ref == 'refs/heads/release' && 'integration') || '' }}

    steps:
      - name: Validate resolved target environment
        env:
          TARGET_ENVIRONMENT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || (startsWith(github.ref, 'refs/tags/v') && 'production') || (startsWith(github.ref, 'refs/heads/release/v') && 'staging') || (github.ref == 'refs/heads/release' && 'integration') || '' }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            integration|staging|production)
              echo "Resolved target environment: $TARGET_ENVIRONMENT"
              ;;
            *)
              echo "Error: Unable to resolve valid target_environment for event '${{ github.event_name }}' and ref '${{ github.ref }}'." >&2
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Backend image metadata
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/festival-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Extract Frontend image metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/festival-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Frontend Firebase build configuration
        id: frontend_config
        env:
          FRONT_FIREBASE_API_KEY: ${{ vars.FRONT_FIREBASE_API_KEY }}
          FRONT_FIREBASE_AUTH_DOMAIN: ${{ vars.FRONT_FIREBASE_AUTH_DOMAIN }}
          FRONT_FIREBASE_PROJECT_ID: ${{ vars.FRONT_FIREBASE_PROJECT_ID }}
          FRONT_FIREBASE_APP_ID: ${{ vars.FRONT_FIREBASE_APP_ID }}
        run: |
          if [ -n "$FRONT_FIREBASE_API_KEY" ] && [ -n "$FRONT_FIREBASE_AUTH_DOMAIN" ] && [ -n "$FRONT_FIREBASE_PROJECT_ID" ] && [ -n "$FRONT_FIREBASE_APP_ID" ]; then
            echo "push_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping GHCR push for festival-frontend (building Dockerfile verification only) because FRONT_FIREBASE_API_KEY, FRONT_FIREBASE_AUTH_DOMAIN, FRONT_FIREBASE_PROJECT_ID, or FRONT_FIREBASE_APP_ID is not configured for this environment."
          fi

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: ${{ steps.frontend_config.outputs.push_frontend == 'true' }}
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          build-args: |
            FRONT_API_BASE=${{ vars.FRONT_API_BASE || '' }}
            FRONT_FIREBASE_API_KEY=${{ vars.FRONT_FIREBASE_API_KEY || 'demo-api-key' }}
            FRONT_FIREBASE_AUTH_DOMAIN=${{ vars.FRONT_FIREBASE_AUTH_DOMAIN || 'demo-festival.firebaseapp.com' }}
            FRONT_FIREBASE_PROJECT_ID=${{ vars.FRONT_FIREBASE_PROJECT_ID || 'demo-festival' }}
            FRONT_FIREBASE_APP_ID=${{ vars.FRONT_FIREBASE_APP_ID || '1:000000000000:web:demo' }}
            FRONT_FIREBASE_AUTH_EMULATOR_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Target Host
    needs: [verify, build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build-and-push.outputs.target_environment }}
      url: ${{ vars.DEPLOY_PUBLIC_URL }}
    outputs:
      deployed: ${{ steps.host_check.outputs.configured }}

    steps:
      - name: Check deployment host configuration
        id: host_check
        env:
          TARGET_ENVIRONMENT: ${{ needs.build-and-push.outputs.target_environment }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REQUIRE_DEPLOY_TARGET: ${{ vars.REQUIRE_DEPLOY_TARGET }}
          TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
        run: |
          if [ -n "$TARGET_HOST" ] && [ -n "$SSH_KEY" ] && [ -n "$PUBLIC_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$TARGET_HOST" ] || [ -n "$SSH_KEY" ] || [ -n "$PUBLIC_URL" ]; then
            echo "::error::Partial deployment configuration for ${TARGET_ENVIRONMENT}: DEPLOY_HOST, DEPLOY_SSH_PRIVATE_KEY, and DEPLOY_PUBLIC_URL must all be set together."
            exit 1
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REQUIRE_DEPLOY_TARGET" = "true" ] || [[ "$GIT_REF" =~ ^refs/tags/v[1-9][0-9]*\. ]]; then
            echo "::error::Missing required deployment configuration (DEPLOY_HOST, DEPLOY_SSH_PRIVATE_KEY, DEPLOY_PUBLIC_URL) for ${TARGET_ENVIRONMENT}."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping remote SSH rollout for ${TARGET_ENVIRONMENT}: DEPLOY_HOST, DEPLOY_SSH_PRIVATE_KEY, and DEPLOY_PUBLIC_URL are not configured."
          fi

      - name: Deploy to Target Host via SSH
        if: steps.host_check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'webadmin' }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            cd /opt/Festival
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            git diff --quiet
            git diff --cached --quiet
            bash cloud-setup/03-prepare-images.sh
            docker compose --env-file cloud-setup/.env -f cloud-setup/compose.yml up -d postgres --wait
            docker run --rm --network festival-cloud_default --env-file cloud-setup/.env \
              -e DB_HOST=postgres -e DB_PORT=5432 -e DATABASE=festival_octv3_db \
              -e DB_USER=festivaladmin -e DB_SSL=false -e DB_SCHEMA=orgs \
              -v "${PWD}:/app:ro" -w /app oven/bun:1.4.2-alpine bun run scripts/migrate.ts
            docker compose --env-file cloud-setup/.env -f cloud-setup/compose.yml up -d --no-build --pull never

  smoke-test:
    name: Post-Deploy Health & Smoke Verification
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build-and-push.outputs.target_environment }}
    env:
      DEPLOYED: ${{ needs.deploy.outputs.deployed }}
      BASE_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
      DEPLOY_SMOKE_ORG_SLUG: ${{ vars.DEPLOY_SMOKE_ORG_SLUG }}

    steps:
      - name: Verify /healthz, /api/bootstrap, and tenant landing endpoint
        run: |
          if [ "$DEPLOYED" != "true" ]; then
            echo "::warning::Skipping post-deploy smoke verification because remote SSH rollout was skipped."
            exit 0
          fi
          if [ -z "$BASE_URL" ]; then
            echo "::error::DEPLOY_PUBLIC_URL is required for post-deploy smoke verification."
            exit 1
          fi
          normalized_base="${BASE_URL%/}"
          smoke_org_slug="${DEPLOY_SMOKE_ORG_SLUG:-pafe}"
          for i in {1..12}; do
            health_payload="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "${normalized_base}/healthz" || true)"
            if [ "$health_payload" = '{"status":"ok"}' ] \
              && curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                "${normalized_base}/api/bootstrap" \
                --output "$RUNNER_TEMP/deploy-bootstrap.json" \
              && jq --exit-status '.session.authenticated == false' \
                "$RUNNER_TEMP/deploy-bootstrap.json" > /dev/null \
              && {
                [ "$smoke_org_slug" = "none" ] || {
                  curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                    "${normalized_base}/api/organizations/${smoke_org_slug}/landing" \
                    --output "$RUNNER_TEMP/deploy-landing.json" \
                    && jq --exit-status --arg slug "$smoke_org_slug" \
                      '.organization.slug == $slug and (.organization.name | type == "string") and (.festivals | type == "array")' \
                      "$RUNNER_TEMP/deploy-landing.json" > /dev/null
                }
              }; then
              echo "Health check (/healthz), /api/bootstrap, and tenant landing smoke check passed on attempt $i"
              exit 0
            fi
            if [ "$i" -lt 12 ]; then
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done
          echo "::error::Post-deploy smoke verification failed after 12 attempts."
          exit 1
