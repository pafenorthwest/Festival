name: Performance Benchmark (500 Parents)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'RUN_LOAD_TEST' to execute (safety safeguard)"
        required: true
        type: string
      concurrency:
        description: 'Concurrent parent requests'
        required: true
        default: '500'
      apply_seed:
        description: 'Seed perf-test org and sessions'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  guard-check:
    name: Safety guard check
    runs-on: ubuntu-latest
    steps:
      - name: Validate actor and confirmation
        env:
          ACTOR: ${{ github.actor }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          FAILED=0
          if [ "$ACTOR" != "gustobru" ] && [ "$ACTOR" != "ericpassmore" ]; then
            echo "::error::Actor '$ACTOR' is not authorized to run performance benchmarks. Allowed actors: gustobru, ericpassmore"
            FAILED=1
          fi
          if [ "$CONFIRMATION" != "RUN_LOAD_TEST" ]; then
            echo "::error::Invalid confirmation '$CONFIRMATION'. Must type 'RUN_LOAD_TEST' to execute."
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "Guard check passed for $ACTOR."

  seed-remote:
    needs: [guard-check]
    if: ${{ inputs.apply_seed }}
    runs-on: ubuntu-latest
    environment: integration

    steps:
      - name: Seed database on Integration Host via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DO_INTEGRATION_HOST }}
          username: ${{ secrets.DO_INTEGRATION_USER || 'webadmin' }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
            cd /opt/Festival
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            DB_NAME=$(docker compose --env-file cloud-setup/.env -f cloud-setup/compose.yml exec -T postgres psql -U festivaladmin -d postgres -t -A -c "SELECT datname FROM pg_database WHERE datname NOT IN ('postgres','template0','template1') LIMIT 1;" | tr -d '\r')
            echo "Found database: $DB_NAME"
            docker compose --env-file cloud-setup/.env -f cloud-setup/compose.yml exec -T postgres psql -U festivaladmin -d "$DB_NAME" < database/seeds/04-perf-test.sql

  benchmark:
    needs: [guard-check, seed-remote]
    if: always() && needs.guard-check.result == 'success' && (needs.seed-remote.result == 'success' || needs.seed-remote.result == 'skipped')
    runs-on: ubuntu-latest
    environment: integration

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify perf-test landing
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              https://int.artsfestival.online/api/organizations/perf-test/landing > /dev/null; then
              echo "perf-test landing endpoint is reachable and healthy on attempt $i"
              exit 0
            fi
            if [ "$i" -lt 12 ]; then
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done
          echo "perf-test landing check failed after 12 attempts"
          exit 1

      - name: Run benchmark
        run: BASE_URL=https://int.artsfestival.online CONCURRENCY=${{ inputs.concurrency }} bun run --cwd packages/backend perf:children
