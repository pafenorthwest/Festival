map $http_x_forwarded_proto $festival_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

map $http_x_forwarded_port $festival_forwarded_port {
  default $http_x_forwarded_port;
  ""      $server_port;
}

server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow Firebase's cross-origin sign-in popup to report that it closed.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  location /api {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;

    # Preserve the public-facing hostname and protocol through an outer proxy.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $festival_forwarded_proto;
    proxy_set_header X-Forwarded-Port  $festival_forwarded_port;

    # Preserve the client address while retaining any existing proxy chain.
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
