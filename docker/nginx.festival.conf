client_max_body_size 64k;
client_body_timeout 10s;
client_header_timeout 10s;
large_client_header_buffers 2 8k;

log_format festival_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
  listen 8080 default_server;
  server_name _;
  keepalive_timeout 30s;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout festival_safe;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_connect_timeout 5s;
  proxy_send_timeout 15s;
  proxy_read_timeout 15s;
  proxy_request_buffering on;
  proxy_buffering on;

  location = /healthz {
    limit_except GET { deny all; }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    return 200 '{"status":"ok"}';
  }

  location = /health { return 404; }
  location ~ ^/(?:webhooks|internal|metrics|ready|readiness|debug)(?:/|$) { return 404; }

  location ~ ^/api/organizations/[^/]+/admin/membership-products$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/(?:bootstrap|firebase-session|memberships|invites/[^/]+|organizations/[^/]+$|organizations/[^/]+/(?:primary|divisions|landing|membership-products|festivals/[^/]+)$|organizations/[^/]+/admin/users|organizations/[^/]+/membership-products|v1/auth/me)$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/(?:organizations|invites|invites/[^/]+/accept|organizations/[^/]+/welcome/dismiss|organizations/[^/]+/admin/membership-products(?:/[^/]+/retire)?|organizations/[^/]+/admin/shopify/diagnostics|v1/auth/sync|v1/auth/login-event)$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/(?:memberships|invites)/[^/]+$ {
    limit_except DELETE OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/(?:festivals(?:/[^/]+(?:/primary|/rooms)?)?|shopify|shopify-customer-account)$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/(?:divisions|festivals/[^/]+/(?:class-subtypes|classes))$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/timezone$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/registration-configuration$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/registration-age-date$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/(?:divisions/[^/]+|(?:class-subtypes|instruments)(?:/[^/]+)?)$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/festivals/[^/]+/classes/[^/]+$ {
    limit_except POST PATCH OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/festivals/[^/]+/registration-window$ {
    limit_except PUT PATCH OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/festivals/[^/]+/registrations/[^/]+/change-log$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/festivals/[^/]+/registrations/[^/]+/(?:promote|drop|transfer)$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/customers/[^/]+/checkout-intents$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/checkout-intents/[^/]+/(?:invalidate|recover)$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/customers(?:/[^/]+)?$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/(?:entitlements/[^/]+/revoke|accompanist-offering(?:/[^/]+)?)$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/accompanist-policy$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/billing/(?:mismatches|customers/[^/]+/(?:credit-balance|ledger))$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/billing/adjustments$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/staff/accompanists$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location = /api/customer-auth/callback {
    limit_except GET OPTIONS { deny all; }
    proxy_read_timeout 45s;
    proxy_pass http://backend:3000;
  }

  location = /api/shopify/webhooks/orders-paid {
    limit_except POST { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/(?:customer-auth/start|customer/session|customer/orders|customer/membership-status|customer/membership-purchase/[^/]+)$ {
    limit_except GET OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/logout$ {
    limit_except POST OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/checkout$ {
    limit_except POST OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/checkout-recovery/[^/]+/checkout$ {
    limit_except POST OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/checkout-recovery/[^/]+$ {
    limit_except GET OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/profile$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/(?:customer|customer-account)/availability$ {
    limit_except GET PUT OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/(?:accompanist-membership|children)$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/(?:children/[^/]+/age-snapshot|class-checkout|festivals/[^/]+/registration/(?:checkout|eligibility)|class-registrations/[^/]+/(?:drop|transfer))$ {
    limit_except POST OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/(?:class-registrations|festivals/[^/]+/registration/(?:teachers|eligible-classes|accompanists|class-registrations))$ {
    limit_except GET OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/(?:festivals/[^/]+/registration/)?class-registrations/[^/]+/metadata$ {
    limit_except PATCH OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/festivals/[^/]+/volunteers/(?:roles(?:/[^/]+(?:/shifts(?:/[^/]+)?)?)?|enroll)$ {
    limit_except GET POST PATCH DELETE OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/festivals/[^/]+/volunteers/(?:shifts|my-schedule|coverage-gaps)$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/festivals/[^/]+/volunteers/(?:book|assignments/[^/]+/cancel)$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/repertoire/queue$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/repertoire/queue/[^/]+/(?:claim|unclaim|normalize|flag|resolve-flag)$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/repertoire/catalog$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/communication/templates$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/communication/templates/[^/]+$ {
    limit_except PATCH OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/communication/logs$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/communication/events$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/customer/orgs/[^/]+/profiles/(?:teacher|accompanist)$ {
    limit_except GET PUT OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/admin/orgs/[^/]+/profiles/(?:teachers|accompanists)$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/admin/orgs/[^/]+/profiles/(?:teachers|accompanists)/[^/]+/approval$ {
    limit_except PATCH OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/org-info/[^/]+/directory/profiles$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location /api/ { return 404; }
  location = /api { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
