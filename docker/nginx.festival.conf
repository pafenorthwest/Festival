client_max_body_size 64k;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;
large_client_header_buffers 2 8k;

log_format festival_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout festival_safe;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_connect_timeout 5s;
  proxy_send_timeout 15s;
  proxy_read_timeout 15s;
  proxy_request_buffering on;
  proxy_buffering on;

  location = /healthz {
    limit_except GET { deny all; }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    return 200 '{"status":"ok"}';
  }

  location = /health { return 404; }
  location ~ ^/(?:webhooks|internal|metrics|ready|readiness|debug)(?:/|$) { return 404; }

  location ~ ^/api/(?:bootstrap|firebase-session|memberships|invites/[^/]+|organizations/[^/]+|organizations/[^/]+/admin/users|organizations/[^/]+/membership-products|v1/auth/me)$ {
    limit_except GET OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/(?:organizations|invites|invites/[^/]+/accept|organizations/[^/]+/welcome/dismiss|organizations/[^/]+/admin/membership-products|v1/auth/sync|v1/auth/login-event)$ {
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/(?:memberships|invites)/[^/]+$ {
    limit_except DELETE OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/admin/(?:festivals|shopify|shopify-customer-account)$ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://backend:3000;
  }

  location = /api/customer-auth/callback {
    limit_except GET OPTIONS { deny all; }
    proxy_read_timeout 45s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/(?:customer-auth/start|customer/session|customer/orders)$ {
    limit_except GET OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location ~ ^/api/organizations/[^/]+/customer/logout$ {
    limit_except POST OPTIONS { deny all; }
    proxy_read_timeout 30s;
    proxy_pass http://backend:3000;
  }

  location /api/ { return 404; }
  location = /api { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
