name: festival-cloud

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: festivaladmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in cloud-setup/.env}
      POSTGRES_DB: festival_sepv2_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festivaladmin -d festival_sepv2_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: festival-backend:cloud
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_USER: festivaladmin
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in cloud-setup/.env}
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE: festival_sepv2_db
      DB_SSL: "false"
      DB_SCHEMA: orgs
      SHOPIFY_ADMIN_AUDIT_PATH: /var/log/festival/shopify-admin-audit.ndjson
    volumes:
      - shopify_audit:/var/log/festival
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: festival-frontend:cloud
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONT_API_BASE: ""
        FRONT_FIREBASE_API_KEY: ${FRONT_FIREBASE_API_KEY:?Set FRONT_FIREBASE_API_KEY in cloud-setup/.env}
        FRONT_FIREBASE_AUTH_DOMAIN: ${FRONT_FIREBASE_AUTH_DOMAIN:?Set FRONT_FIREBASE_AUTH_DOMAIN in cloud-setup/.env}
        FRONT_FIREBASE_PROJECT_ID: ${FRONT_FIREBASE_PROJECT_ID:?Set FRONT_FIREBASE_PROJECT_ID in cloud-setup/.env}
        FRONT_FIREBASE_APP_ID: ${FRONT_FIREBASE_APP_ID:?Set FRONT_FIREBASE_APP_ID in cloud-setup/.env}
        FRONT_FIREBASE_AUTH_EMULATOR_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
  shopify_audit:

networks:
  default:
    enable_ipv6: true
